name: Deploy (PR preview)

# Every pull request gets its own live URL at
# https://ebbsanchez.github.io/clancy-music-sites/pr-preview/pr-<N>/
# The preview is torn down automatically when the PR closes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: github.event.action != 'closed'

      - name: Build with preview base path
        if: github.event.action != 'closed'
        run: npm run build
        env:
          PUBLIC_BASE_PATH: /clancy-music-sites/pr-preview/pr-${{ github.event.number }}

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist
          umbrella-dir: pr-preview
